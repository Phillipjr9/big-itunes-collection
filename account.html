<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Account | Big ITunes Collection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="site-header" data-active=""></div>

  <main class="section" style="padding-top:2rem">
    <div class="container">
      <nav class="breadcrumb">
        <a href="index.html">Home</a> / <span>Account</span>
      </nav>
      <h1 class="font-display" style="font-size:1.75rem;margin-bottom:1.5rem">My Account</h1>

      <div class="account-layout">
        <nav class="account-nav">
          <a href="#" class="active" data-panel="orders">Order History</a>
          <a href="wishlist.html">Wishlist</a>
          <a href="#" data-panel="profile">Profile</a>
          <a href="#" data-panel="addresses">Addresses</a>
        </nav>

        <div>
          <!-- Order confirmation banner -->
          <div id="orderSuccess" class="hidden order-confirm" style="background:#ECFDF5;border:1px solid #A7F3D0;border-radius:1rem;padding:1.25rem;margin-bottom:1.25rem">
            <span class="order-confirm-check" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
            <div>
              <h3 style="font-family:var(--font-body);font-weight:600;color:#065F46;margin-bottom:0.35rem">Order placed successfully 🎉</h3>
              <p style="font-size:0.875rem;color:#047857" id="orderSuccessMsg"></p>
            </div>
          </div>

          <div class="account-panel" id="panelOrders">
            <h2 style="font-family:var(--font-body);font-weight:600;font-size:1.1rem;margin-bottom:1rem">Order History</h2>
            <div id="ordersList"></div>
          </div>

          <div class="account-panel hidden" id="panelProfile">
            <h2 style="font-family:var(--font-body);font-weight:600;font-size:1.1rem;margin-bottom:1rem">Profile</h2>
            <form id="profileForm">
              <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" name="name" class="form-input" placeholder="Your name" />
              </div>
              <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-input" placeholder="you@email.com" />
              </div>
              <div class="form-group">
                <label class="form-label">Phone</label>
                <input type="tel" name="phone" class="form-input" placeholder="0803 123 4567" />
              </div>
              <button type="submit" class="btn btn-primary">Save Profile</button>
            </form>
          </div>

          <div class="account-panel hidden" id="panelAddresses">
            <h2 style="font-family:var(--font-body);font-weight:600;font-size:1.1rem;margin-bottom:1rem">Saved Addresses</h2>
            <p class="text-muted" style="font-size:0.875rem">Address book will appear here after you place an order. You can manage delivery details during checkout.</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <div id="toast" class="toast"></div>

  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script>
    // Panels
    document.querySelectorAll(".account-nav a[data-panel]").forEach(link => {
      link.addEventListener("click", e => {
        e.preventDefault();
        document.querySelectorAll(".account-nav a").forEach(a => a.classList.remove("active"));
        link.classList.add("active");
        document.querySelectorAll(".account-panel").forEach(p => p.classList.add("hidden"));
        const panel = document.getElementById("panel" + link.dataset.panel.charAt(0).toUpperCase() + link.dataset.panel.slice(1));
        if (panel) panel.classList.remove("hidden");
      });
    });

    // Orders
    function renderOrders() {
      const orders = getOrders();
      const el = document.getElementById("ordersList");
      if (orders.length === 0) {
        el.innerHTML = `
          <div class="empty-state">
            <p>No orders yet</p>
            <a href="shop.html" class="btn btn-outline" style="margin-top:0.75rem">Start Shopping</a>
          </div>`;
        return;
      }
      el.innerHTML = orders.map(o => `
        <div class="order-card">
          <div class="order-header">
            <div class="order-id">
              <span class="order-ref">${o.id}</span>
              <span class="order-date">${new Date(o.date).toLocaleDateString("en-NG", { dateStyle: "medium" })}</span>
            </div>
            <span class="badge badge-soft">${o.status}</span>
          </div>
          <div class="order-items">
            ${o.items.map(i => `${i.name} (${i.size}) × ${i.qty}`).join(" · ")}
          </div>
          <div class="order-foot">
            <span class="order-location">${o.delivery.state} · ${o.delivery.city}</span>
            <span class="order-total">${formatPrice(o.total)}</span>
          </div>
        </div>
      `).join("");
    }

    // Order success from checkout
    const params = new URLSearchParams(location.search);
    const orderId = params.get("order") || sessionStorage.getItem("lastOrderId");
    if (orderId) {
      const orders = getOrders();
      const order = orders.find(o => o.id === orderId);
      if (order) {
        document.getElementById("orderSuccess").classList.remove("hidden");
        document.getElementById("orderSuccessMsg").textContent =
          `Order ${order.id} · Total ${formatPrice(order.total)} · We’ll contact you on ${order.customer.phone} shortly.`;
        sessionStorage.removeItem("lastOrderId");
      }
    }

    // Profile
    const user = getUser();
    if (user) {
      const form = document.getElementById("profileForm");
      form.name.value = user.name || "";
      form.email.value = user.email || "";
      form.phone.value = user.phone || "";
    }
    document.getElementById("profileForm").onsubmit = e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      saveUser({
        name: fd.get("name"),
        email: fd.get("email"),
        phone: fd.get("phone")
      });
      showToast("Profile saved");
    };

    renderOrders();
  </script>
</body>
</html>
