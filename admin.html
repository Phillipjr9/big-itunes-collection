<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | Big ITunes Collection</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="site-header" data-active=""></div>
  <main class="section">
    <div class="container" style="max-width:54rem">
      <nav class="breadcrumb"><a href="index.html">Home</a> / <span>Admin</span></nav>
      <h1 class="font-display">Admin Dashboard (Demo)</h1>
      <p style="color:var(--muted);margin-top:0.5rem">This is a demo admin page. Use the demo accounts listed in README to sign in (no backend in this demo).</p>
      <form id="adminLogin" style="max-width:28rem;margin-top:1rem">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-input" placeholder="admin@bigitunescollection.com" />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-input" placeholder="admin123" />
        </div>
        <button class="btn btn-primary">Sign In</button>
      </form>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/common.js"></script>
</body>
</html>
