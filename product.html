<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product | Big ITunes Collection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="site-header" data-active="shop"></div>

  <main class="section" style="padding-top:2rem">
    <div class="container">
      <nav class="breadcrumb" id="breadcrumb"></nav>

      <div class="pdp-grid" id="pdp">
        <!-- Filled by JS -->
      </div>

      <!-- Complete the Look -->
      <div class="complete-look" id="completeLook">
        <h3 class="font-display">Complete the Look</h3>
        <div class="product-grid" id="relatedGrid"></div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <div id="toast" class="toast"></div>

  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const productId = parseInt(params.get("id"), 10);
    const product = PRODUCTS.find(p => p.id === productId);

    if (!product) {
      document.getElementById("pdp").innerHTML = `
        <div class="empty-state" style="grid-column:1/-1">
          <p>Product not found.</p>
          <a href="shop.html" class="btn btn-primary" style="margin-top:1rem">Back to Shop</a>
        </div>`;
    } else {
      document.title = product.name + " | Big ITunes Collection";
      let selectedColor = product.colors[0];
      let selectedSize = product.sizes[0];
      let qty = 1;
      let mainImg = product.images[0];

      function renderPDP() {
        const discount = getDiscount(product);
        const inWish = isInWishlist(product.id);
        const catName = CATEGORIES.find(c => c.id === product.category)?.name || product.category;

        document.getElementById("breadcrumb").innerHTML = `
          <a href="index.html">Home</a> /
          <a href="shop.html">Shop</a> /
          <a href="shop.html?category=${product.category}">${catName}</a> /
          <span>${product.name}</span>
        `;

        document.getElementById("pdp").innerHTML = `
          <div class="pdp-gallery">
            <div class="pdp-main-img" id="mainImgWrap">
              <img src="${mainImg}" alt="${product.name}" id="mainImg" />
            </div>
            <div class="pdp-thumbs">
              ${product.images.map((img, i) => `
                <button class="pdp-thumb ${img === mainImg ? "active" : ""}" data-img="${img}">
                  <img src="${img}" alt="" />
                </button>
              `).join("")}
            </div>
          </div>
          <div class="pdp-info">
            ${product.isNew ? '<span class="badge badge-new" style="margin-bottom:0.5rem">New</span>' : ""}
            <h1>${product.name}</h1>
            <div class="pdp-price">
              <span class="current">${formatPrice(product.price)}</span>
              ${product.original ? `<span class="original">${formatPrice(product.original)}</span>` : ""}
              ${discount ? `<span class="discount">-${discount}%</span>` : ""}
            </div>
            <p style="font-size:0.9rem;color:#4B5563;line-height:1.65;margin-bottom:1.25rem">${product.description}</p>

            <div class="option-label">Colour: <span style="font-weight:400;text-transform:none;letter-spacing:0">${selectedColor.name}</span></div>
            <div class="color-options">
              ${product.colors.map(c => `
                <button class="color-opt ${c.hex === selectedColor.hex ? "active" : ""}" style="background:${c.hex}" data-hex="${c.hex}" data-name="${c.name}" title="${c.name}"></button>
              `).join("")}
            </div>

            <div class="option-label">Size</div>
            <div class="size-options">
              ${product.sizes.map(s => `
                <button class="size-opt ${s === selectedSize ? "active" : ""}" data-size="${s}">${s}</button>
              `).join("")}
            </div>
            <p style="font-size:0.75rem;margin-top:-0.75rem;margin-bottom:1rem">
              <a href="index.html#size-guide" style="color:var(--blush-600);text-decoration:underline">Size guide</a>
              ${product.stock[selectedSize] != null ? ` · ${product.stock[selectedSize]} left in ${selectedSize}` : ""}
            </p>

            <div class="qty-row">
              <span class="option-label" style="margin:0">Quantity</span>
              <div class="qty-control">
                <button type="button" id="qtyMinus">−</button>
                <span id="qtyVal">${qty}</span>
                <button type="button" id="qtyPlus">+</button>
              </div>
            </div>

            <div class="pdp-actions">
              <button class="btn btn-primary btn-lg" id="addCartBtn" style="flex:1">Add to Cart</button>
              <button class="btn btn-outline btn-lg" id="buyNowBtn" style="flex:1">Buy Now</button>
              <button class="heart-btn ${inWish ? "active" : ""}" id="wishBtn" style="position:static;width:3rem;height:3rem" aria-label="Wishlist">
                <svg width="20" height="20" fill="${inWish ? "currentColor" : "none"}" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
              </button>
            </div>

            <div class="pdp-meta">
              <p><strong>Fabric:</strong> ${product.fabric}</p>
              <p><strong>Care:</strong> ${product.care}</p>
              <p style="margin-top:0.75rem">Delivery across Lagos, Abuja, Port Harcourt, Ibadan, Enugu, Kano, Benin City & nationwide. Free delivery on orders over ₦45,000.</p>
              <p style="margin-top:0.5rem">Easy returns within 7 days. <a href="#">Returns policy</a></p>
            </div>
          </div>
        `;

        // Bind events
        document.querySelectorAll(".pdp-thumb").forEach(btn => {
          btn.onclick = () => {
            mainImg = btn.dataset.img;
            document.getElementById("mainImg").src = mainImg;
            document.querySelectorAll(".pdp-thumb").forEach(t => t.classList.toggle("active", t.dataset.img === mainImg));
          };
        });

        document.querySelectorAll(".color-opt").forEach(btn => {
          btn.onclick = () => {
            selectedColor = { hex: btn.dataset.hex, name: btn.dataset.name };
            renderPDP();
          };
        });

        document.querySelectorAll(".size-opt").forEach(btn => {
          btn.onclick = () => {
            selectedSize = btn.dataset.size;
            renderPDP();
          };
        });

        document.getElementById("qtyMinus").onclick = () => { if (qty > 1) { qty--; document.getElementById("qtyVal").textContent = qty; } };
        document.getElementById("qtyPlus").onclick = () => { qty++; document.getElementById("qtyVal").textContent = qty; };

        document.getElementById("addCartBtn").onclick = () => {
          addToCart(product.id, selectedSize, selectedColor.hex, qty);
        };
        document.getElementById("buyNowBtn").onclick = () => {
          addToCart(product.id, selectedSize, selectedColor.hex, qty);
          location.href = "checkout.html";
        };
        document.getElementById("wishBtn").onclick = () => {
          window.bitcToggleWish(product.id);
          renderPDP();
        };
      }

      renderPDP();

      // Related / Complete the Look
      const related = PRODUCTS
        .filter(p => p.id !== product.id && (p.category === product.category || p.isBestseller))
        .slice(0, 4);
      document.getElementById("relatedGrid").innerHTML = related.map(p => productCardHTML(p)).join("");
    }
  </script>
</body>
</html>
