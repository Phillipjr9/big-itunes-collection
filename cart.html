<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Cart | Big ITunes Collection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="site-header" data-active=""></div>

  <main class="section" style="padding-top:2rem">
    <div class="container">
      <nav class="breadcrumb">
        <a href="index.html">Home</a> / <span>Cart</span>
      </nav>
      <h1 class="font-display" style="font-size:1.75rem;margin-bottom:1.5rem">Your Cart</h1>

      <div class="cart-layout" id="cartLayout">
        <!-- Filled by JS -->
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <div id="toast" class="toast"></div>

  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script>
    function renderCart() {
      const cart = getCart();
      const layout = document.getElementById("cartLayout");

      if (cart.length === 0) {
        layout.innerHTML = `
          <div class="empty-state" style="grid-column:1/-1">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
            <p>Your cart is empty</p>
            <a href="shop.html" class="btn btn-primary" style="margin-top:1rem">Continue Shopping</a>
          </div>`;
        return;
      }

      const subtotal = getCartSubtotal();
      const freeShip = subtotal >= FREE_SHIPPING_THRESHOLD;
      const remaining = FREE_SHIPPING_THRESHOLD - subtotal;

      layout.innerHTML = `
        <div>
          ${cart.map((item, i) => `
            <div class="cart-item">
              <a href="product.html?id=${item.id}">
                <img src="${item.image}" alt="${item.name}" />
              </a>
              <div style="flex:1;min-width:0">
                <a href="product.html?id=${item.id}" style="font-weight:500;font-size:0.9rem">${item.name}</a>
                <p style="font-size:0.8rem;color:#6B7280;margin-top:0.25rem">
                  ${item.size} · ${item.colorName || ""}
                  <span style="display:inline-block;width:0.7rem;height:0.7rem;border-radius:50%;background:${item.colorHex};vertical-align:middle;margin-left:0.25rem;border:1px solid rgba(0,0,0,0.08)"></span>
                </p>
                <p style="font-weight:600;color:var(--blush-600);margin-top:0.35rem;font-size:0.9rem">${formatPrice(item.price)}</p>
                <div style="display:flex;align-items:center;gap:0.5rem;margin-top:0.6rem">
                  <div class="qty-control">
                    <button onclick="changeQty(${i},-1)">−</button>
                    <span>${item.qty}</span>
                    <button onclick="changeQty(${i},1)">+</button>
                  </div>
                  <button onclick="removeItem(${i})" style="font-size:0.75rem;color:#9CA3AF;margin-left:auto">Remove</button>
                </div>
              </div>
              <div style="font-weight:600;font-size:0.9rem;white-space:nowrap">${formatPrice(item.price * item.qty)}</div>
            </div>
          `).join("")}
          <a href="shop.html" class="btn btn-ghost" style="margin-top:1rem">← Continue Shopping</a>
        </div>

        <div class="cart-summary">
          <h3 style="font-family:var(--font-body);font-weight:600;margin-bottom:1rem">Order Summary</h3>
          ${!freeShip ? `
            <div style="background:var(--blush-50);border-radius:0.75rem;padding:0.75rem 1rem;margin-bottom:1rem;font-size:0.8rem;color:var(--blush-800)">
              Add ${formatPrice(remaining)} more for <strong>free nationwide delivery</strong>
              <div style="height:4px;background:var(--blush-200);border-radius:2px;margin-top:0.5rem;overflow:hidden">
                <div style="height:100%;width:${Math.min(100, (subtotal / FREE_SHIPPING_THRESHOLD) * 100)}%;background:var(--blush-500);border-radius:2px"></div>
              </div>
            </div>
          ` : `
            <div style="background:#ECFDF5;border-radius:0.75rem;padding:0.75rem 1rem;margin-bottom:1rem;font-size:0.8rem;color:#065F46">
              🎉 You’ve unlocked free nationwide delivery
            </div>
          `}
          <div class="summary-row"><span>Subtotal</span><span>${formatPrice(subtotal)}</span></div>
          <div class="summary-row"><span>Delivery</span><span style="color:#6B7280">Calculated at checkout</span></div>
          <div class="summary-total"><span>Total</span><span>${formatPrice(subtotal)}</span></div>
          <a href="checkout.html" class="btn btn-primary btn-block btn-lg" style="margin-top:1.25rem">Proceed to Checkout</a>
          <p style="font-size:0.7rem;color:#9CA3AF;text-align:center;margin-top:0.75rem">Secure checkout · Pay on delivery available</p>
        </div>
      `;
    }

    window.changeQty = function(i, d) {
      updateCartQty(i, d);
      renderCart();
    };
    window.removeItem = function(i) {
      removeFromCart(i);
      renderCart();
      showToast("Item removed");
    };

    renderCart();
  </script>
</body>
</html>
