<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop Women’s Clothing | Big ITunes Collection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="site-header" data-active="shop"></div>

  <main class="section" style="padding-top:2rem">
    <div class="container">
      <nav class="breadcrumb">
        <a href="index.html">Home</a> / <span>Shop</span>
      </nav>

      <div style="margin-bottom:1.5rem">
        <h1 class="font-display" style="font-size:1.75rem;margin-bottom:0.25rem" id="shopTitle">Women’s Clothing</h1>
        <p class="text-muted" style="font-size:0.9rem">Exclusive fashion made for her</p>
      </div>

      <div class="shop-search-row">
        <label for="shopSearch" class="sr-only">Search products</label>
        <input type="search" id="shopSearch" class="shop-search-input" placeholder="Search dresses, tops, colors, styles..." autocomplete="off" />
        <div class="shop-search-suggest hidden" id="shopSearchSuggest" role="listbox" aria-label="Search suggestions"></div>
      </div>

      <div class="shop-layout">
        <div class="filters-overlay" id="filtersOverlay" aria-hidden="true"></div>
        <!-- Filters -->
        <aside class="filters" id="filters" aria-hidden="false">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
            <h2 style="font-size:0.9rem;font-weight:600;font-family:var(--font-body)">Filters</h2>
            <div style="display:flex;align-items:center;gap:0.5rem">
              <button id="clearFilters" class="btn-ghost" style="font-size:0.75rem;color:var(--blush-600)">Clear all</button>
              <button type="button" id="closeFiltersBtn" class="btn btn-outline btn-sm" style="display:none">Done</button>
            </div>
          </div>

          <div class="filter-group">
            <div class="filter-title">Category</div>
            <label class="filter-option"><input type="checkbox" name="category" value="dresses" /> Dresses</label>
            <label class="filter-option"><input type="checkbox" name="category" value="tops" /> Tops</label>
            <label class="filter-option"><input type="checkbox" name="category" value="bottoms" /> Bottoms</label>
            <label class="filter-option"><input type="checkbox" name="category" value="sets" /> Two-Piece Sets</label>
            <label class="filter-option"><input type="checkbox" name="category" value="jumpsuits" /> Jumpsuits</label>
          </div>

          <div class="filter-group">
            <div class="filter-title">Size</div>
            <div class="size-filter" id="sizeFilters">
              <button type="button" class="size-chip" data-size="XS">XS</button>
              <button type="button" class="size-chip" data-size="S">S</button>
              <button type="button" class="size-chip" data-size="M">M</button>
              <button type="button" class="size-chip" data-size="L">L</button>
              <button type="button" class="size-chip" data-size="XL">XL</button>
              <button type="button" class="size-chip" data-size="XXL">XXL</button>
            </div>
          </div>

          <div class="filter-group">
            <div class="filter-title">Colour</div>
            <div class="color-filter" id="colorFilters">
              <!-- populated by JS -->
            </div>
          </div>

          <div class="filter-group">
            <div class="filter-title">Price (₦)</div>
            <div class="price-range">
              <input type="number" id="priceMin" class="form-input" placeholder="Min" min="0" step="1000" style="padding:0.5rem" />
              <span style="color:#9CA3AF">–</span>
              <input type="number" id="priceMax" class="form-input" placeholder="Max" min="0" step="1000" style="padding:0.5rem" />
            </div>
          </div>

          <div class="filter-group">
            <div class="filter-title">Availability</div>
            <label class="filter-option"><input type="checkbox" id="filterNew" /> New Arrivals</label>
            <label class="filter-option"><input type="checkbox" id="filterSale" /> On Sale</label>
            <label class="filter-option"><input type="checkbox" id="filterBestseller" /> Best Sellers</label>
          </div>

          <div class="filters-mobile-actions">
            <button type="button" class="btn btn-outline btn-block" id="cancelFilterBtn">Cancel</button>
            <button type="button" class="btn btn-primary btn-block" id="applyFilterBtn">Apply Filters</button>
          </div>
        </aside>

        <!-- Products -->
        <div>
          <div class="shop-toolbar">
            <span class="results-count" id="resultsCount">Showing 0 products</span>
            <div style="display:flex;align-items:center;gap:0.75rem">
              <button id="mobileFilterBtn" class="btn btn-outline btn-sm" style="display:none" aria-controls="filters" aria-expanded="false">Filters</button>
              <select id="sortSelect" class="sort-select">
                <option value="featured">Featured</option>
                <option value="newest">Newest</option>
                <option value="bestselling">Best Selling</option>
                <option value="price-asc">Price: Low to High</option>
                <option value="price-desc">Price: High to Low</option>
              </select>
            </div>
          </div>
          <div class="active-filters hidden" id="activeFilters" aria-label="Selected filters"></div>
          <div class="product-grid" id="productGrid"></div>
          <div id="noResults" class="empty-state hidden">
            <p>No products match your filters.</p>
            <button class="btn btn-outline" style="margin-top:1rem" id="resetFilters">Reset filters</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <div id="toast" class="toast"></div>

  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script>
    // Collect unique colors from products
    const allColors = [];
    PRODUCTS.forEach(p => {
      p.colors.forEach(c => {
        if (!allColors.find(x => x.hex === c.hex)) allColors.push(c);
      });
    });

    const colorFiltersEl = document.getElementById("colorFilters");
    colorFiltersEl.innerHTML = allColors.map(c =>
      `<button type="button" class="color-swatch" data-hex="${c.hex}" style="background:${c.hex}" title="${c.name}"></button>`
    ).join("");
    const searchInput = document.getElementById("shopSearch");
    const suggestBox = document.getElementById("shopSearchSuggest");

    // State
    const state = {
      query: "",
      categories: new Set(),
      sizes: new Set(),
      colors: new Set(),
      minPrice: null,
      maxPrice: null,
      isNew: false,
      isSale: false,
      isBestseller: false,
      sort: "featured"
    };

    // URL params
    const params = new URLSearchParams(location.search);
    state.query = (params.get("q") || "").trim();
    params.getAll("category").forEach(c => state.categories.add(c));
    params.getAll("size").forEach(s => state.sizes.add(s));
    params.getAll("color").forEach(h => state.colors.add(h));
    if (params.get("min")) state.minPrice = params.get("min");
    if (params.get("max")) state.maxPrice = params.get("max");
    if (params.get("new") === "1") state.isNew = true;
    if (params.get("sale") === "1") state.isSale = true;
    if (params.get("bestseller") === "1") state.isBestseller = true;
    if (params.get("sort")) state.sort = params.get("sort");

    // Sync UI from state
    function syncUI() {
      document.querySelectorAll('input[name="category"]').forEach(el => {
        el.checked = state.categories.has(el.value);
      });
      document.querySelectorAll(".size-chip").forEach(el => {
        el.classList.toggle("active", state.sizes.has(el.dataset.size));
      });
      document.querySelectorAll(".color-swatch").forEach(el => {
        el.classList.toggle("active", state.colors.has(el.dataset.hex));
      });
      document.getElementById("filterNew").checked = state.isNew;
      document.getElementById("filterSale").checked = state.isSale;
      document.getElementById("filterBestseller").checked = state.isBestseller;
      document.getElementById("sortSelect").value = state.sort;
      document.getElementById("priceMin").value = state.minPrice || "";
      document.getElementById("priceMax").value = state.maxPrice || "";
      document.getElementById("shopSearch").value = state.query;

      // Title
      let title = "Women’s Clothing";
      if (state.categories.size === 1) {
        const cat = [...state.categories][0];
        title = CATEGORIES.find(c => c.id === cat)?.name || title;
      }
      if (state.isNew) title = "New Arrivals";
      if (state.isSale) title = "Sale";
      document.getElementById("shopTitle").textContent = title;
    }

    function updateURLFromState() {
      const p = new URLSearchParams();
      if (state.query) p.set("q", state.query);
      [...state.categories].forEach(c => p.append("category", c));
      [...state.sizes].forEach(s => p.append("size", s));
      [...state.colors].forEach(h => p.append("color", h));
      if (state.minPrice) p.set("min", state.minPrice);
      if (state.maxPrice) p.set("max", state.maxPrice);
      if (state.isNew) p.set("new", "1");
      if (state.isSale) p.set("sale", "1");
      if (state.isBestseller) p.set("bestseller", "1");
      if (state.sort && state.sort !== "featured") p.set("sort", state.sort);
      const query = p.toString();
      history.replaceState(null, "", query ? `${location.pathname}?${query}` : location.pathname);
    }

    function escapeRegExp(str) {
      return str.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function highlightText(text, query) {
      const q = (query || "").trim();
      if (!q) return text;
      const rgx = new RegExp(`(${escapeRegExp(q)})`, "ig");
      return String(text).replace(rgx, "<mark>$1</mark>");
    }

    function getSearchSuggestions(query) {
      const q = query.toLowerCase().trim();
      if (!q) return [];
      const scored = PRODUCTS.map(p => {
        const hay = [p.name, p.category, p.subcategory, ...(p.colors || []).map(c => c.name)].join(" ").toLowerCase();
        const starts = p.name.toLowerCase().startsWith(q) ? 3 : 0;
        const includes = hay.includes(q) ? 1 : 0;
        return { product: p, score: starts + includes };
      }).filter(x => x.score > 0)
        .sort((a, b) => b.score - a.score || a.product.name.localeCompare(b.product.name))
        .slice(0, 6)
        .map(x => x.product);
      return scored;
    }

    function renderSuggestions() {
      const q = (state.query || "").trim();
      const list = getSearchSuggestions(q);
      if (!q || list.length === 0) {
        suggestBox.classList.add("hidden");
        suggestBox.innerHTML = "";
        return;
      }
      suggestBox.classList.remove("hidden");
      suggestBox.innerHTML = list.map((p, idx) => {
        const sub = p.subcategory || p.category;
        return `<button type="button" class="suggest-item" role="option" data-name="${p.name.replace(/"/g, "&quot;")}" data-index="${idx}">
          <span class="name">${highlightText(p.name, q)}</span>
          <span class="meta">${sub}</span>
        </button>`;
      }).join("");

      suggestBox.querySelectorAll(".suggest-item").forEach(btn => {
        btn.onclick = () => {
          state.query = btn.dataset.name;
          render();
          suggestBox.classList.add("hidden");
          searchInput.blur();
        };
      });
    }

    function renderActiveFilters() {
      const box = document.getElementById("activeFilters");
      const chips = [];
      if (state.query) chips.push({ type: "query", key: state.query, label: `Search: ${state.query}` });
      state.categories.forEach(v => chips.push({ type: "category", key: v, label: CATEGORIES.find(c => c.id === v)?.name || v }));
      state.sizes.forEach(v => chips.push({ type: "size", key: v, label: `Size ${v}` }));
      state.colors.forEach(v => {
        const found = allColors.find(c => c.hex === v);
        chips.push({ type: "color", key: v, label: found ? found.name : "Colour" });
      });
      if (state.minPrice) chips.push({ type: "min", key: state.minPrice, label: `Min ₦${Number(state.minPrice).toLocaleString("en-NG")}` });
      if (state.maxPrice) chips.push({ type: "max", key: state.maxPrice, label: `Max ₦${Number(state.maxPrice).toLocaleString("en-NG")}` });
      if (state.isNew) chips.push({ type: "new", key: "1", label: "New Arrivals" });
      if (state.isSale) chips.push({ type: "sale", key: "1", label: "On Sale" });
      if (state.isBestseller) chips.push({ type: "bestseller", key: "1", label: "Best Sellers" });

      if (!chips.length) {
        box.classList.add("hidden");
        box.innerHTML = "";
        return;
      }

      box.classList.remove("hidden");
      box.innerHTML = chips.map(c =>
        `<button type="button" class="filter-chip" data-type="${c.type}" data-key="${c.key}">${c.label} <span aria-hidden="true">×</span></button>`
      ).join("") + '<button type="button" class="filter-chip clear" id="chipClearAll">Clear all</button>';

      box.querySelectorAll(".filter-chip[data-type]").forEach(btn => {
        btn.onclick = () => {
          const type = btn.dataset.type;
          const key = btn.dataset.key;
          if (type === "category") state.categories.delete(key);
          if (type === "query") state.query = "";
          if (type === "size") state.sizes.delete(key);
          if (type === "color") state.colors.delete(key);
          if (type === "min") state.minPrice = null;
          if (type === "max") state.maxPrice = null;
          if (type === "new") state.isNew = false;
          if (type === "sale") state.isSale = false;
          if (type === "bestseller") state.isBestseller = false;
          render();
        };
      });

      const clear = document.getElementById("chipClearAll");
      if (clear) clear.onclick = clearAll;
    }

    function filterProducts() {
      let list = [...PRODUCTS];

      if (state.query) {
        const q = state.query.toLowerCase();
        list = list.filter(p => {
          const haystack = [
            p.name,
            p.category,
            p.subcategory,
            p.description,
            p.fabric,
            p.care,
            ...(p.colors || []).map(c => c.name)
          ].join(" ").toLowerCase();
          return haystack.includes(q);
        });
      }

      if (state.categories.size) {
        list = list.filter(p => state.categories.has(p.category));
      }
      if (state.sizes.size) {
        list = list.filter(p => p.sizes.some(s => state.sizes.has(s)));
      }
      if (state.colors.size) {
        list = list.filter(p => p.colors.some(c => state.colors.has(c.hex)));
      }
      if (state.minPrice != null && state.minPrice !== "") {
        list = list.filter(p => p.price >= Number(state.minPrice));
      }
      if (state.maxPrice != null && state.maxPrice !== "") {
        list = list.filter(p => p.price <= Number(state.maxPrice));
      }
      if (state.isNew) list = list.filter(p => p.isNew);
      if (state.isSale) list = list.filter(p => p.original && p.original > p.price);
      if (state.isBestseller) list = list.filter(p => p.isBestseller);

      // Sort
      switch (state.sort) {
        case "newest":
          list.sort((a, b) => (b.isNew ? 1 : 0) - (a.isNew ? 1 : 0) || b.id - a.id);
          break;
        case "bestselling":
          list.sort((a, b) => (b.isBestseller ? 1 : 0) - (a.isBestseller ? 1 : 0));
          break;
        case "price-asc":
          list.sort((a, b) => a.price - b.price);
          break;
        case "price-desc":
          list.sort((a, b) => b.price - a.price);
          break;
        default:
          list.sort((a, b) => (b.isBestseller ? 1 : 0) - (a.isBestseller ? 1 : 0) || (b.isNew ? 1 : 0) - (a.isNew ? 1 : 0));
      }

      return list;
    }

    function render() {
      syncUI();
      const list = filterProducts();
      const grid = document.getElementById("productGrid");
      const noRes = document.getElementById("noResults");
      document.getElementById("resultsCount").textContent = `Showing ${list.length} product${list.length !== 1 ? "s" : ""}`;
      document.getElementById("applyFilterBtn").textContent = `Show ${list.length} item${list.length !== 1 ? "s" : ""}`;

      if (list.length === 0) {
        grid.innerHTML = "";
        noRes.classList.remove("hidden");
      } else {
        noRes.classList.add("hidden");
        grid.innerHTML = list.map(p => productCardHTML(p)).join("");
        if (state.query) {
          grid.querySelectorAll(".product-card-title").forEach(el => {
            el.innerHTML = highlightText(el.textContent, state.query);
          });
        }
      }

      renderActiveFilters();
      renderSuggestions();
      updateURLFromState();
    }

    // Events
    document.querySelectorAll('input[name="category"]').forEach(el => {
      el.addEventListener("change", () => {
        if (el.checked) state.categories.add(el.value);
        else state.categories.delete(el.value);
        render();
      });
    });

    document.querySelectorAll(".size-chip").forEach(el => {
      el.addEventListener("click", () => {
        const s = el.dataset.size;
        if (state.sizes.has(s)) state.sizes.delete(s);
        else state.sizes.add(s);
        render();
      });
    });

    document.querySelectorAll(".color-swatch").forEach(el => {
      el.addEventListener("click", () => {
        const h = el.dataset.hex;
        if (state.colors.has(h)) state.colors.delete(h);
        else state.colors.add(h);
        render();
      });
    });

    document.getElementById("filterNew").addEventListener("change", e => { state.isNew = e.target.checked; render(); });
    document.getElementById("filterSale").addEventListener("change", e => { state.isSale = e.target.checked; render(); });
    document.getElementById("filterBestseller").addEventListener("change", e => { state.isBestseller = e.target.checked; render(); });
    document.getElementById("sortSelect").addEventListener("change", e => { state.sort = e.target.value; render(); });

    let priceTimer;
    ["priceMin", "priceMax"].forEach(id => {
      document.getElementById(id).addEventListener("input", e => {
        clearTimeout(priceTimer);
        priceTimer = setTimeout(() => {
          state.minPrice = document.getElementById("priceMin").value;
          state.maxPrice = document.getElementById("priceMax").value;
          render();
        }, 300);
      });
    });

    let searchTimer;
    searchInput.addEventListener("input", e => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        state.query = e.target.value.trim();
        render();
      }, 200);
    });

    searchInput.addEventListener("focus", () => {
      renderSuggestions();
    });
    searchInput.addEventListener("keydown", e => {
      if (e.key === "Escape") {
        suggestBox.classList.add("hidden");
      }
    });
    document.addEventListener("click", e => {
      if (!suggestBox.contains(e.target) && e.target !== searchInput) {
        suggestBox.classList.add("hidden");
      }
    });

    function clearAll() {
      state.query = "";
      state.categories.clear();
      state.sizes.clear();
      state.colors.clear();
      state.minPrice = null;
      state.maxPrice = null;
      state.isNew = false;
      state.isSale = false;
      state.isBestseller = false;
      state.sort = "featured";
      document.getElementById("shopSearch").value = "";
      document.getElementById("priceMin").value = "";
      document.getElementById("priceMax").value = "";
      render();
    }
    document.getElementById("clearFilters").onclick = clearAll;
    document.getElementById("resetFilters").onclick = clearAll;

    // Mobile filter bottom sheet
    const mobileFilterBtn = document.getElementById("mobileFilterBtn");
    const filtersEl = document.getElementById("filters");
    const filtersOverlay = document.getElementById("filtersOverlay");
    const closeFiltersBtn = document.getElementById("closeFiltersBtn");
    const cancelFilterBtn = document.getElementById("cancelFilterBtn");
    const applyFilterBtn = document.getElementById("applyFilterBtn");

    function isMobileView() {
      return window.innerWidth < 1024;
    }

    function openFilters() {
      if (!isMobileView()) return;
      filtersEl.classList.add("open");
      filtersOverlay.classList.add("open");
      filtersEl.setAttribute("aria-hidden", "false");
      mobileFilterBtn.setAttribute("aria-expanded", "true");
      document.body.classList.add("no-scroll");
    }

    function closeFilters() {
      filtersEl.classList.remove("open");
      filtersOverlay.classList.remove("open");
      filtersEl.setAttribute("aria-hidden", "true");
      mobileFilterBtn.setAttribute("aria-expanded", "false");
      document.body.classList.remove("no-scroll");
    }

    function syncFilterUIByViewport() {
      if (isMobileView()) {
        mobileFilterBtn.style.display = "";
        filtersEl.setAttribute("aria-hidden", "true");
        closeFiltersBtn.style.display = "";
      } else {
        mobileFilterBtn.style.display = "none";
        filtersEl.classList.remove("open");
        filtersOverlay.classList.remove("open");
        filtersEl.setAttribute("aria-hidden", "false");
        mobileFilterBtn.setAttribute("aria-expanded", "false");
        closeFiltersBtn.style.display = "none";
        document.body.classList.remove("no-scroll");
      }
    }

    mobileFilterBtn.onclick = openFilters;
    filtersOverlay.onclick = closeFilters;
    closeFiltersBtn.onclick = closeFilters;
    cancelFilterBtn.onclick = closeFilters;
    applyFilterBtn.onclick = closeFilters;
    window.addEventListener("resize", syncFilterUIByViewport);
    syncFilterUIByViewport();

    // On the shop page, tapping the header search icon should focus this search field.
    document.addEventListener("DOMContentLoaded", () => {
      const navSearch = document.querySelector('a.nav-icon[aria-label="Search"]');
      if (!navSearch) return;
      navSearch.setAttribute("href", "#shopSearch");
      navSearch.addEventListener("click", e => {
        e.preventDefault();
        searchInput.focus();
        searchInput.scrollIntoView({ behavior: "smooth", block: "center" });
      });
    });

    render();
  </script>
</body>
</html>
