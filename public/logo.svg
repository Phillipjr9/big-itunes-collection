<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="Big ITunes Collection">
  <title>Big ITunes Collection</title>
  <!-- Monogram -->
  <g fill="none" stroke="#C45B7A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <!-- B stem -->
    <path d="M250 70 V200"/>
    <!-- B bowls -->
    <path d="M250 70 H290 C330 70 345 95 345 120 C345 145 330 160 290 160 H250"/>
    <path d="M250 160 H300 C345 160 365 185 365 215 C365 250 340 275 295 275 H250"/>
    <!-- Flourish / I curve -->
    <path d="M220 250 C200 230 195 190 220 155 C250 115 310 100 355 115"/>
    <path d="M355 115 C390 130 400 170 375 200"/>
  </g>
  <!-- Spark accent -->
  <g fill="#C45B7A">
    <path d="M210 245 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z"/>
  </g>
  <!-- Wordmark -->
  <text x="320" y="340" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="600" letter-spacing="2">
    <tspan fill="#2A2A2A">BIG </tspan><tspan fill="#C45B7A">ITunes</tspan>
  </text>
  <!-- Divider + COLLECTION -->
  <line x1="160" y1="365" x2="250" y2="365" stroke="#C45B7A" stroke-width="1.5"/>
  <line x1="390" y1="365" x2="480" y2="365" stroke="#C45B7A" stroke-width="1.5"/>
  <text x="320" y="372" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" letter-spacing="8" fill="#3A3A3A">COLLECTION</text>
  <circle cx="320" cy="390" r="2.5" fill="#C45B7A"/>
</svg>
