<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout | Big ITunes Collection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://js.paystack.co/v1/inline.js"></script>
</head>
<body>
  <div id="site-header" data-active=""></div>

  <main class="section" style="padding-top:2rem">
    <div class="container">
      <nav class="breadcrumb">
        <a href="index.html">Home</a> / <a href="cart.html">Cart</a> / <span>Checkout</span>
      </nav>
      <h1 class="font-display" style="font-size:1.75rem;margin-bottom:1.5rem">Checkout</h1>

      <div id="checkoutEmpty" class="empty-state hidden">
        <p>Your cart is empty.</p>
        <a href="shop.html" class="btn btn-primary" style="margin-top:1rem">Shop Now</a>
      </div>

      <form id="checkoutForm" class="checkout-layout">
        <div>
          <div class="checkout-section">
            <h3>Contact Information</h3>
            <div class="form-group">
              <label class="form-label">Full Name *</label>
              <input type="text" name="name" required class="form-input" placeholder="Your full name" />
            </div>
            <div class="form-group">
              <label class="form-label">Phone Number *</label>
              <input type="tel" name="phone" required class="form-input" placeholder="e.g. 0803 123 4567" />
            </div>
            <div class="form-group">
              <label class="form-label">Email *</label>
              <input type="email" name="email" required class="form-input" placeholder="you@email.com" />
            </div>
          </div>

          <div class="checkout-section">
            <h3>Delivery Information</h3>
            <div class="form-group">
              <label class="form-label">State *</label>
              <select name="state" id="stateSelect" required class="form-select">
                <option value="">Select State</option>
                <option value="Lagos">Lagos</option>
                <option value="Abuja (FCT)">Abuja (FCT)</option>
                <option value="Port Harcourt (Rivers)">Port Harcourt (Rivers)</option>
                <option value="Ibadan (Oyo)">Ibadan (Oyo)</option>
                <option value="Enugu">Enugu</option>
                <option value="Kano">Kano</option>
                <option value="Benin City (Edo)">Benin City (Edo)</option>
                <option value="Other (Nationwide)">Other (Nationwide)</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">City *</label>
              <input type="text" name="city" required class="form-input" placeholder="City" />
            </div>
            <div class="form-group">
              <label class="form-label">Delivery Address *</label>
              <input type="text" name="address" required class="form-input" placeholder="Street address, building, apartment" />
            </div>
            <div class="form-group">
              <label class="form-label">Landmark</label>
              <input type="text" name="landmark" class="form-input" placeholder="Nearby landmark (optional)" />
            </div>
            <div class="form-group">
              <label class="form-label">Delivery Instructions</label>
              <textarea name="instructions" rows="2" class="form-textarea" placeholder="Any special instructions (optional)"></textarea>
            </div>
            <div id="deliveryEstimate" style="font-size:0.85rem;color:#4B5563;background:var(--blush-50);padding:0.75rem 1rem;border-radius:0.75rem;display:none"></div>
          </div>

          <div class="checkout-section">
            <h3>Payment Method</h3>
            <p id="paystackStatusNote" style="font-size:0.8rem;color:#6B7280;margin-bottom:1rem"></p>
            <label style="display:flex;align-items:center;gap:0.75rem;padding:0.85rem 1rem;border:1px solid #E5E7EB;border-radius:0.75rem;margin-bottom:0.5rem;cursor:pointer">
              <input type="radio" name="payment" value="pod" id="payPod" style="accent-color:var(--blush-500)" />
              <span style="font-size:0.875rem">Pay on Delivery / Bank Transfer</span>
            </label>
            <label id="payCardLabel" style="display:flex;align-items:center;gap:0.75rem;padding:0.85rem 1rem;border:1px solid #E5E7EB;border-radius:0.75rem;cursor:pointer">
              <input type="radio" name="payment" value="card" id="payCard" checked style="accent-color:var(--blush-500)" />
              <span style="font-size:0.875rem">Pay with Card / Bank / USSD (Paystack)</span>
            </label>
            <p id="paystackHint" style="font-size:0.75rem;color:#9CA3AF;margin-top:0.5rem"></p>
            <div id="paystackKeyBox" class="hidden" style="margin-top:1rem;padding:1rem;background:#FFF7ED;border:1px solid #FED7AA;border-radius:0.75rem">
              <p style="font-size:0.8rem;font-weight:600;color:#9A3412;margin-bottom:0.5rem">Enable card pay — paste Paystack public key</p>
              <p style="font-size:0.72rem;color:#9A3412;margin-bottom:0.75rem">
                Use <code>pk_test_…</code> or <code>pk_live_…</code> only.
                The secret key (<code>sk_…</code>) goes in Vercel env, not here.
              </p>
              <div style="display:flex;flex-wrap:wrap;gap:0.5rem">
                <input type="text" id="checkoutPaystackKey" class="form-input" placeholder="pk_live_… or pk_test_…" style="flex:1;min-width:12rem;font-size:0.8rem" autocomplete="off" />
                <button type="button" class="btn btn-primary btn-sm" id="saveCheckoutPaystackKey">Save & enable card</button>
              </div>
              <p id="checkoutPaystackKeyError" style="font-size:0.75rem;color:#DC2626;margin-top:0.5rem;display:none"></p>
            </div>
          </div>
        </div>

        <div>
          <div class="cart-summary" id="orderSummary"></div>
        </div>
      </form>
    </div>
  </main>

  <div id="site-footer"></div>
  <div id="toast" class="toast"></div>

  <script src="js/site-config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/paystack-config.js"></script>
  <script src="js/common.js"></script>
  <script>
    const cart = getCart();
    if (cart.length === 0) {
      document.getElementById("checkoutEmpty").classList.remove("hidden");
      document.getElementById("checkoutForm").classList.add("hidden");
    } else {
      let paystackReady = typeof isPaystackConfigured === "function" && isPaystackConfigured();
      const note = document.getElementById("paystackStatusNote");
      const hint = document.getElementById("paystackHint");
      const payCard = document.getElementById("payCard");
      const payPod = document.getElementById("payPod");
      const keyBox = document.getElementById("paystackKeyBox");

      function applyPaystackUiState() {
        paystackReady = typeof isPaystackConfigured === "function" && isPaystackConfigured();
        if (paystackReady) {
          note.innerHTML = '<span style="color:#065F46">✓ Paystack is connected. Card, bank transfer, and USSD are available.</span>';
          hint.textContent = "Secure Paystack window · payment is verified on our server before the order is confirmed.";
          payCard.disabled = false;
          payCard.checked = true;
          document.getElementById("payCardLabel").style.opacity = "1";
          document.getElementById("payCardLabel").style.cursor = "pointer";
          if (keyBox) keyBox.classList.add("hidden");
        } else {
          note.innerHTML = '<span style="color:#B45309"><strong>Card pay is waiting for your public key.</strong> Paste <code>pk_test_…</code> or <code>pk_live_…</code> below (or in Admin → Settings). Secret key (<code>sk_…</code>) is only for Vercel — it does not enable card pay by itself.</span>';
          hint.textContent = "Until a public key is saved, only Pay on Delivery works.";
          payPod.checked = true;
          payCard.disabled = true;
          document.getElementById("payCardLabel").style.opacity = "0.55";
          document.getElementById("payCardLabel").style.cursor = "not-allowed";
          if (keyBox) keyBox.classList.remove("hidden");
        }
        if (typeof updateSummary === "function") updateSummary();
      }

      applyPaystackUiState();

      const saveKeyBtn = document.getElementById("saveCheckoutPaystackKey");
      if (saveKeyBtn) {
        saveKeyBtn.onclick = () => {
          const raw = (document.getElementById("checkoutPaystackKey").value || "").trim();
          const err = document.getElementById("checkoutPaystackKeyError");
          if (raw.startsWith("sk_")) {
            err.style.display = "block";
            err.textContent = "That is a secret key. Use the public key that starts with pk_ only.";
            return;
          }
          if (!raw.startsWith("pk_test_") && !raw.startsWith("pk_live_")) {
            err.style.display = "block";
            err.textContent = "Key must start with pk_test_ or pk_live_";
            return;
          }
          err.style.display = "none";
          setPaystackPublicKey(raw);
          window.BITC_PAYSTACK_PUBLIC_KEY = raw;
          showToast("Paystack public key saved — card pay enabled");
          applyPaystackUiState();
        };
      }

      function updateSummary() {
        const state = document.getElementById("stateSelect").value;
        const subtotal = getCartSubtotal();
        const delivery = getDeliveryFee(state);
        const total = subtotal + delivery;
        const freeShip = subtotal >= FREE_SHIPPING_THRESHOLD;
        const method = (document.querySelector('input[name="payment"]:checked') || {}).value || "pod";

        const est = document.getElementById("deliveryEstimate");
        if (state) {
          est.style.display = "block";
          const days = state === "Lagos" ? "1–3" : state.includes("Abuja") || state.includes("Ibadan") ? "2–4" : "3–6";
          est.innerHTML = `<strong>Delivery to ${state}:</strong> ${freeShip ? "FREE" : formatPrice(delivery)} · Estimated ${days} business days`;
        } else {
          est.style.display = "none";
        }

        const btnLabel = method === "card" && paystackReady ? "Pay with Paystack" : "Place Order";

        document.getElementById("orderSummary").innerHTML = `
          <h3 style="font-family:var(--font-body);font-weight:600;margin-bottom:1rem">Order Summary</h3>
          <div style="max-height:220px;overflow-y:auto;margin-bottom:1rem">
            ${cart.map(i => `
              <div style="display:flex;gap:0.75rem;margin-bottom:0.75rem;font-size:0.8rem">
                <img src="${i.image}" alt="" style="width:3.5rem;height:4.25rem;object-fit:cover;border-radius:0.5rem" />
                <div style="flex:1">
                  <p style="font-weight:500">${i.name}</p>
                  <p style="color:#6B7280">${i.size} · ${i.colorName || ""} × ${i.qty}</p>
                  <p style="font-weight:600;color:var(--blush-600)">${formatPrice(i.price * i.qty)}</p>
                </div>
              </div>
            `).join("")}
          </div>
          <div class="summary-row"><span>Subtotal</span><span>${formatPrice(subtotal)}</span></div>
          <div class="summary-row">
            <span>Delivery ${state ? `(${state})` : ""}</span>
            <span>${!state ? "Select state" : freeShip ? "FREE" : formatPrice(delivery)}</span>
          </div>
          ${freeShip ? '<p style="font-size:0.75rem;color:#065F46;margin-bottom:0.5rem">🎉 Free nationwide delivery unlocked</p>' : ""}
          <div class="summary-total"><span>Total</span><span id="grandTotal">${formatPrice(total)}</span></div>
          <button type="submit" class="btn btn-primary btn-block btn-lg" id="placeOrderBtn" style="margin-top:1.25rem">${btnLabel}</button>
          <p style="font-size:0.7rem;color:#9CA3AF;text-align:center;margin-top:0.75rem">
            ${method === "card" && paystackReady ? "Secured by Paystack · Cards, bank, USSD" : "You will receive order confirmation after placing"}
          </p>
        `;
      }

      document.getElementById("stateSelect").addEventListener("change", updateSummary);
      document.querySelectorAll('input[name="payment"]').forEach(r => r.addEventListener("change", updateSummary));
      updateSummary();

      function buildOrderFromForm(form, paymentMeta = {}) {
        const fd = new FormData(form);
        const state = fd.get("state");
        const subtotal = getCartSubtotal();
        const delivery = getDeliveryFee(state);
        return {
          id: "BITC-" + Date.now().toString(36).toUpperCase(),
          date: new Date().toISOString(),
          items: getCart(),
          customer: { name: fd.get("name"), phone: fd.get("phone"), email: fd.get("email") },
          delivery: {
            state, city: fd.get("city"), address: fd.get("address"),
            landmark: fd.get("landmark"), instructions: fd.get("instructions"), fee: delivery
          },
          payment: fd.get("payment"),
          paymentStatus: paymentMeta.paymentStatus || (fd.get("payment") === "card" ? "pending" : "pod"),
          paystackRef: paymentMeta.paystackRef || null,
          paystackChannel: paymentMeta.paystackChannel || null,
          subtotal,
          total: subtotal + delivery,
          status: "Processing",
          statusHistory: [{
            status: "Processing",
            at: new Date().toISOString(),
            by: "System",
            note: paymentMeta.note || "Order placed"
          }]
        };
      }

      function finalizeOrder(order) {
        const orders = getOrders();
        orders.unshift(order);
        saveOrders(orders);
        if (typeof deductStockForOrder === "function") deductStockForOrder(order.items, order.id);
        saveCart([]);
        updateNavBadges();
        sessionStorage.setItem("lastOrderId", order.id);
        location.href = "account.html?order=" + order.id;
      }

      async function verifyPaystackOnServer(reference, amountNaira, orderId) {
        const endpoints = ["/api/verify-paystack", "/api/verify-paystack.js"];
        let lastError = "Verification failed";
        for (const url of endpoints) {
          try {
            const res = await fetch(url, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ reference, amount: amountNaira, orderId })
            });
            const data = await res.json().catch(() => ({}));
            if (res.ok && data.verified) return data;
            lastError = data.error || lastError;
            if (res.status === 404) continue;
            return data;
          } catch (err) {
            lastError = err.message || "Network error during verification";
          }
        }
        return { verified: false, error: lastError };
      }

      function resetPayButton() {
        const btn = document.getElementById("placeOrderBtn");
        if (btn) {
          btn.disabled = false;
          btn.textContent = "Pay with Paystack";
        }
      }

      function payWithPaystack(order) {
        const key = getPaystackPublicKey();
        if (!key || typeof PaystackPop === "undefined") {
          showToast("Paystack is not available. Choose Pay on Delivery or set your public key.");
          resetPayButton();
          return;
        }
        const amountKobo = Math.round(Number(order.total) * 100);
        if (!amountKobo || amountKobo < 100) {
          showToast("Invalid payment amount");
          resetPayButton();
          return;
        }
        const paymentRef = order.id + "-" + Date.now().toString(36);
        const handler = PaystackPop.setup({
          key: key,
          email: order.customer.email,
          amount: amountKobo,
          currency: "NGN",
          ref: paymentRef,
          metadata: {
            custom_fields: [
              { display_name: "Order ID", variable_name: "order_id", value: order.id },
              { display_name: "Customer Phone", variable_name: "phone", value: order.customer.phone || "" },
              { display_name: "Delivery State", variable_name: "state", value: order.delivery.state || "" }
            ]
          },
          callback: function (response) {
            const reference = response.reference || paymentRef;
            const btn = document.getElementById("placeOrderBtn");
            if (btn) {
              btn.disabled = true;
              btn.textContent = "Verifying payment…";
            }
            showToast("Confirming payment with Paystack…");
            verifyPaystackOnServer(reference, order.total, order.id).then((result) => {
              if (!result || !result.verified) {
                order.paymentStatus = "unverified";
                order.paystackRef = reference;
                order.statusHistory.push({
                  status: "Processing",
                  at: new Date().toISOString(),
                  by: "System",
                  note: "Server verification failed: " + (result && result.error ? result.error : "unknown")
                });
                showToast(result && result.error ? ("Payment could not be verified: " + result.error) : "Payment could not be verified on the server");
                resetPayButton();
                return;
              }
              order.paymentStatus = "paid";
              order.paystackRef = result.reference || reference;
              order.paystackChannel = result.channel || null;
              order.paymentVerified = true;
              order.paidAt = result.paidAt || new Date().toISOString();
              order.statusHistory.push({
                status: "Processing",
                at: new Date().toISOString(),
                by: "Paystack",
                note: "Payment verified on server · ref " + (result.reference || reference) + (result.channel ? " · " + result.channel : "")
              });
              showToast("Payment verified 💕");
              finalizeOrder(order);
            }).catch((err) => {
              showToast("Verification error: " + (err.message || "network"));
              resetPayButton();
            });
          },
          onClose: function () {
            resetPayButton();
            showToast("Payment window closed — order not placed");
          }
        });
        handler.openIframe();
      }

      document.getElementById("checkoutForm").onsubmit = (e) => {
        e.preventDefault();
        const form = e.target;
        const submitBtn = form.querySelector('button[type="submit"]');
        const method = (form.querySelector('input[name="payment"]:checked') || {}).value || "pod";
        if (submitBtn) {
          submitBtn.disabled = true;
          submitBtn.textContent = method === "card" ? "Opening Paystack…" : "Placing order…";
        }
        const latestCart = getCart();
        const stockIssue = latestCart.find(i => {
          const available = typeof getStockForSize === "function" ? getStockForSize(i.id, i.size) : null;
          return available != null && i.qty > available;
        });
        if (stockIssue) {
          if (submitBtn) { submitBtn.disabled = false; updateSummary(); }
          showToast(`Only ${getStockForSize(stockIssue.id, stockIssue.size)} left for ${stockIssue.name} (${stockIssue.size})`);
          return;
        }
        if (method === "card") {
          if (!paystackReady) {
            if (submitBtn) { submitBtn.disabled = false; updateSummary(); }
            showToast("Paste your Paystack public key (pk_…) below to enable card pay");
            return;
          }
          const order = buildOrderFromForm(form, { paymentStatus: "pending", note: "Awaiting Paystack payment" });
          payWithPaystack(order);
          return;
        }
        const order = buildOrderFromForm(form, {
          paymentStatus: "pod",
          note: "Order placed · Pay on delivery / bank transfer"
        });
        finalizeOrder(order);
      };
    }
  </script>
</body>
</html>
